name: Garmin daily recovery pull

# Requires a one-time repo secret GARMIN_TOKEN_JSON — see README.md
# ("Automated daily pull"). Scheduled workflows only fire from the
# default branch, so this won't run until merged there.
on:
  schedule:
    - cron: "0 11 * * *" # ~06:00 America/Chicago (CDT); shifts to 05:00 during CST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  pull-garmin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore Garmin session token
        env:
          GARMIN_TOKEN_JSON: ${{ secrets.GARMIN_TOKEN_JSON }}
        run: |
          mkdir -p ~/.garminconnect
          printf '%s' "$GARMIN_TOKEN_JSON" > ~/.garminconnect/garmin_tokens.json

      - name: Pull recovery snapshot
        run: |
          mkdir -p data/garmin
          today=$(date -u +%F)
          python3 garmin_recovery.py --date "$today" --out "data/garmin/$today.json"
          cp "data/garmin/$today.json" data/garmin/latest.json

      - name: Commit and push
        run: |
          git config user.name "garmin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/garmin
          git diff --cached --quiet || git commit -m "Garmin recovery snapshot for $(date -u +%F)"
          git push
