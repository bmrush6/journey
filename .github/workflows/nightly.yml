name: Nightly Garmin backfill

# Requires repo secret GARMIN_TOKEN_JSON — see README.md
# ("Nightly job: Garmin in one DB"). Scheduled workflows only fire from
# the default branch.
on:
  schedule:
    - cron: "0 11 * * *" # ~06:00 America/Chicago (CDT); shifts to 05:00 during CST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  nightly-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore Garmin session token
        env:
          GARMIN_TOKEN_JSON: ${{ secrets.GARMIN_TOKEN_JSON }}
        run: |
          mkdir -p ~/.garminconnect
          printf '%s' "$GARMIN_TOKEN_JSON" > ~/.garminconnect/garmin_tokens.json

      - name: Run nightly job
        run: python3 nightly_job.py

      - name: Commit and push
        run: |
          git config user.name "journey-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/journey.db
          git diff --cached --quiet || git commit -m "Nightly backfill $(date -u +%F)"
          git push
